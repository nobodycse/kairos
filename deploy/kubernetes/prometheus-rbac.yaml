# Prometheus 抓取 kubelet（/metrics 与 /metrics/cadvisor）所需的 SA 与长效 token
# k8s 1.24+ 不再自动生成 SA token，需显式创建 Secret 绑定
# setup_server.sh 从该 Secret 提取 token 写入 /opt/kairos/kubeconfig/prometheus-token，
# 由 docker-compose.monitor.yml 挂载进 Prometheus（bearer_token_file）
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: prometheus
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  # demo-app 的 per-pod 抓取需要服务发现（prometheus.yml kubernetes_sd）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
