# demo-app 部署清单（design.md §6）
# - namespace demo + Deployment payment-service（replicas 2，requests 128Mi / limits 512Mi）
# - 标签 kairos.io/managed=true 是风险白名单的前置条件（architecture.md §11.1）
# - NodePort 30780：Prometheus 经 host.docker.internal:30780 抓 /metrics
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: demo
  labels:
    app: payment-service
    kairos.io/managed: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        kairos.io/managed: "true"
    spec:
      containers:
        - name: app
          # k3s 运行时为内置 containerd（setup_server.sh 配 registries.yaml 镜像加速），
          # 宿主机 docker build 出的镜像需经 docker save | k3s ctr images import 导入
          image: kairos/demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: demo
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30780
---
# 负载发生器（Phase 3 增补）：持续打 /pay 产生 QPS/延迟/5xx 指标——
# 验证模块的错误率/P95 检查与实验 compare 曲线都需要真实流量（此前无流量，曲线为空）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: demo
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:latest
          command: ["/bin/sh", "-c"]
          args:
            - "while true; do wget -q -O- http://payment-service:8000/pay >/dev/null 2>&1 || true; sleep 0.2; done"
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
