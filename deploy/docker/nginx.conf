# frontend 容器（nginx）配置：静态资源 + /api 反代 + /grafana 反代
# 拓扑见 architecture.md §3：公网只进 80，backend/grafana 仅 compose 内网

server {
    listen 80;
    server_name _;

    # Vue history 路由
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代。SSE（/api/v1/faults/{id}/stream）依赖以下三条：
    # 关闭缓冲、HTTP/1.1 长连接、超时放宽（design.md §4.1 心跳 15s）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # deploy.sh 健康检查走这里：顺带验证 nginx → backend 反代链路
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # Grafana 子路径反代（配合 GF_SERVER_SERVE_FROM_SUB_PATH=true）
    # proxy_pass 不带尾斜杠：保留 /grafana 前缀透传——Grafana 以 sub-path 为
    # 规范路径，剥前缀会触发 301 到 root_url（曾因此把浏览器重定向到
    # localhost:3000，2026-10-04 修复，与 root_url 硬编码公网地址配套）
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /grafana {
        return 302 /grafana/;
    }
}
