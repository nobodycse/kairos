# promtail 配置（以 DaemonSet 跑在 k3s 内，读 /var/log/pods，架构见 architecture.md §9）
# 注意：promtail Pod 使用 hostNetwork（见 deploy/kubernetes/promtail.yaml），
# Loki 在宿主机 docker、端口绑 127.0.0.1:3100，因此直接推回环地址
# 本文件是唯一来源：setup_server.sh 用它生成 k8s ConfigMap，勿在 manifest 里复写
#
# 为什么用 static_configs 而不是 kubernetes_sd：实测 k3s 1.36 上 SD 建立连接后
# 不产出目标（无错误、targets 恒 0）。元数据从 filename 标签提取——
# /var/log/containers/<pod>_<namespace>_<container>-<id>.log（pod/namespace 名
# 不含下划线，按下划线切分安全），LogQL 契约不变：
# {namespace="demo", pod=~"payment-.*"} |= "ERROR"
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml  # hostPath /var/promtail 挂载在容器 /tmp（见 promtail.yaml）

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: kubernetes-pods
    static_configs:
      - targets: [localhost]
        labels:
          job: kubernetes-pods
          __path__: /var/log/containers/*.log
    pipeline_stages:
      # k8s 容器日志为 CRI 格式（containerd：JSON 包装的 time/stream/log）
      - cri: {}
      # 从 filename 提取元数据（relabel 是 target 级拿不到逐行 filename）
      - regex:
          source: filename
          expression: '^/var/log/containers/(?P<pod>[^_]+)_(?P<namespace>[^_]+)_(?P<container>.+)-[0-9a-f]{64}\.log$'
      - labels:
          namespace:
          pod:
          container:
