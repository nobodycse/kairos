# Prometheus 抓取配置（architecture.md §4 / §9）
# 抓取目标全部经 host.docker.internal（→ 宿主机），解决
# 「compose 容器 → k3s 集群网络」不可达问题（compose 里配了 host-gateway）：
#   - node-exporter: hostNetwork 直接监听宿主机 9100
#   - kube-state-metrics / demo-app: NodePort 30760 / 30780
#   - kubelet: 10250（https + SA bearer token），cAdvisor 指标在 /metrics/cadvisor
#     （同时覆盖宿主机上平台层容器的容器指标）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["host.docker.internal:30760"]

  - job_name: demo-app
    # per-pod 抓取：NodePort 单目标抓多副本时，/metrics 在副本间随机切换，
    # Counter 序列交替出现两个值，rate() 会误算出虚假速率（告警永不恢复）。
    # 经 kubernetes_sd 按 pod 发现目标，pod/namespace 标签由 relabel 注入
    kubernetes_sd_configs:
      - role: pod
        api_server: https://host.docker.internal:6443
        tls_config:
          insecure_skip_verify: true
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: demo
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8000"
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  - job_name: kubelet
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/token
    static_configs:
      - targets: ["host.docker.internal:10250"]

  - job_name: cadvisor
    metrics_path: /metrics/cadvisor
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/token
    static_configs:
      - targets: ["host.docker.internal:10250"]
