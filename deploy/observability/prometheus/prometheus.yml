# Prometheus 抓取配置（architecture.md §4 / §9）
# 抓取目标全部经 host.docker.internal（→ 宿主机），解决
# 「compose 容器 → k3s 集群网络」不可达问题（compose 里配了 host-gateway）：
#   - node-exporter: hostNetwork 直接监听宿主机 9100
#   - kube-state-metrics / demo-app: NodePort 30760 / 30780
#   - kubelet: 10250（https + SA bearer token），cAdvisor 指标在 /metrics/cadvisor
#     （同时覆盖宿主机上平台层容器的容器指标）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["host.docker.internal:30760"]

  - job_name: demo-app
    static_configs:
      - targets: ["host.docker.internal:30780"]

  - job_name: kubelet
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/token
    static_configs:
      - targets: ["host.docker.internal:10250"]

  - job_name: cadvisor
    metrics_path: /metrics/cadvisor
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/token
    static_configs:
      - targets: ["host.docker.internal:10250"]
