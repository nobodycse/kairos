# KAIROS 告警规则（architecture.md §4.1，共 7 条）
# 标注 VERIFY 的规则以实际指标名为准逐一验证：PodOOMKilled 于 Phase 2 修复，
# ContainerMemoryHigh / ContainerCPUHigh 于 Phase 3 服务器实测修复（join 对齐）。
groups:
  - name: kairos-alerts
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} 10 分钟内重启超过 3 次"

      # last_terminated_reason 是信息型 gauge：OOM 后恒 1 不回落（increase/max_over_time
      # 都无法自动恢复）。changes() 只能捕捉"上次终止原因的跳变"——同一 Pod 连续两次
      # OOM 时 reason 不变，第二次永远不告警（Phase 2 真实链路验收抓出）。改为
      # "重启增量 >0 AND 上次终止原因=OOMKilled"：首次/重复 OOM 都触发，10 分钟窗口
      # 滑过自动归 0，告警随之 resolve
      - alert: PodOOMKilled
        expr: increase(kube_pod_container_status_restarts_total[10m]) > 0 and on(namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} 容器被 OOMKilled（10 分钟内）"

      # VERIFY→已验证（Phase 3 服务器实测修复，2026-10-02）：cAdvisor 与
      # kube-state-metrics 分属两个 job，instance 等标签不一致，直接相除 join
      # 不上（空序列=规则从未触发过）。双侧按 namespace/pod/container 聚合后
      # on() 对齐（实测：CPU 比值稳态 1.0、内存比值 0.07 均出序列）。
      - alert: ContainerMemoryHigh
        expr: sum by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD"}) / on (namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}) > 0.95
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} 内存使用率持续超过 95%"

      - alert: ContainerCPUHigh
        expr: sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])) / on (namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="cpu"}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} CPU 使用率持续超过 90%"

      - alert: HTTPErrorRateHigh
        expr: sum(rate(demo_http_requests_total{status=~"5.."}[5m])) / sum(rate(demo_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "demo 应用 5xx 错误率超过 5%"

      - alert: HTTPLatencyHigh
        expr: histogram_quantile(0.95, sum by (le)(rate(demo_http_request_duration_seconds_bucket[5m]))) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "demo 应用 P95 延迟超过 2s"

      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "节点 {{ $labels.node }} NotReady"
