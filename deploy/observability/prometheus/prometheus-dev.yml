# Prometheus 抓取配置（本地联调专用，配合 docker-compose.dev.yml）
# 与 prometheus.yml（服务器）的差异：仅保留 demo-app job——本地无 k3s，
# node-exporter / kube-state-metrics 无目标，kubelet / cadvisor 还依赖
# /etc/prometheus/token（服务器路径），dev 栈一律不挂。
# demo-app 经 host.docker.internal:30780 抓取（dev compose 把容器 8000 映射到
# 宿主机 30780，复刻 NodePort），rules / alertmanager 段与服务器一字不差，
# 本地验证的告警链路结果可直接平移到服务器。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo-app
    static_configs:
      - targets: ["host.docker.internal:30780"]
