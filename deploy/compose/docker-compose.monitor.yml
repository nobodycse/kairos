# 监控栈 compose：prometheus / alertmanager / grafana / loki
# 与平台层（docker-compose.yml）独立启停，共用 external 网络 kairos-net：
#   - alertmanager → backend:8000 推告警 webhook
#   - frontend nginx → grafana:3000 反代
# 所有端口只绑宿主机回环（architecture.md §3 网络边界），查监控走 SSH 隧道
name: kairos-monitor

networks:
  kairos-net:
    external: true

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      # 抓 kubelet 的 SA token，由 setup_server.sh 从 k8s Secret 提取生成
      - /opt/kairos/kubeconfig/prometheus-token:/etc/prometheus/token:ro
      - /opt/kairos/data/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # prometheus.yml 里全部抓取目标用 host.docker.internal 指向宿主机
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [kairos-net]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    networks: [kairos-net]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # 子路径部署（nginx 反代 /grafana，见 deploy/docker/nginx.conf）
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - /opt/kairos/data/grafana:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # 看板 JSON 由前端先行任务补齐（design.md §8.2）
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks: [kairos-net]

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - /opt/kairos/data/loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks: [kairos-net]
